<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>증권업 주요 뉴스</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#14233a">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="증권 뉴스">
<style>
:root{--ink:#14233a;--sub:#5b6778;--paper:#f7f8fa;--line:#dde2ea;--accent:#0b6e6e;--warn:#b4452a}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.55 "Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
header,nav,main{max-width:640px;margin:auto}
header{padding:20px 18px 8px}
h1{font-size:22px;margin:0}
.upd{color:var(--ink);font-size:14px;font-weight:600;margin:4px 0 0}
.count{color:var(--sub);font-size:13px;padding-top:12px}
.banner{background:#fff4e5;color:#7a4a00;padding:8px 18px;font-size:13px;text-align:center}
nav{display:flex;margin-top:8px;border-bottom:1px solid var(--line)}
nav button{flex:1;padding:12px 4px;font:inherit;font-size:15px;font-weight:600;background:none;border:0;border-bottom:3px solid transparent;color:var(--sub)}
nav button[aria-selected=true]{color:var(--accent);border-color:var(--accent)}
main{padding:0 18px 40px}
ol,ul{list-style:none;margin:0;padding:0}
li{padding:14px 0;border-bottom:1px solid var(--line)}
a{color:inherit;text-decoration:none;font-weight:600}
a:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.meta{color:var(--sub);font-size:13px;margin-top:2px}
.meta span{margin-right:10px}
.tag{font-size:12px;font-weight:700;color:var(--accent);margin-right:6px}
.tag.end{color:var(--sub)}.tag.soon{color:var(--warn)}
.hint{color:var(--sub);font-size:13px;margin:4px 0 0}
details{margin-top:8px;font-size:14px}summary{color:var(--accent);cursor:pointer}
.sub{padding:6px 0 0 4px;font-size:14px}
.empty,.foot{color:var(--sub);font-size:14px;padding-top:16px}
</style></head><body>
<header><h1>증권업 주요 뉴스</h1><p class="upd"><span id="upd"></span></p></header>
<div class="banner" id="sample" hidden>샘플 데이터입니다. 자동 수집이 한 번 실행되면 실제 데이터로 바뀝니다.</div>
<nav role="tablist">
<button role="tab" id="t-industry" aria-selected="true">증권업 뉴스</button>
<button role="tab" id="t-hmc" aria-selected="false">현대차증권 뉴스</button>
</nav>
<main><div id="view"></div><div class="foot" id="foot"></div></main>
<script>
const $=s=>document.querySelector(s);
const el=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e};
const link=(u,x)=>{const a=el('a',null,x);if(/^https?:\/\//.test(u||'')){a.href=u;a.target='_blank';a.rel='noopener'}return a};
const meta=(...p)=>{const d=el('div','meta');p.filter(Boolean).forEach(x=>d.append(el('span',null,x)));return d};
const TABS=['industry','hmc'];let D={industry:[],hmc:[],notes:[]},tab='industry';
const EMPTY={industry:'불러온 증권업 기사가 없습니다. 잠시 후 다시 확인해 주세요.',hmc:'최근 현대차증권 관련 기사가 없거나 아직 불러오지 못했습니다.'};
function render(){
  const v=$('#view');v.replaceChildren();
  TABS.forEach(k=>$('#t-'+k).setAttribute('aria-selected',k===tab));
  const L=D[tab]||[];
  if(!L.length)return v.append(el('p','empty',EMPTY[tab]));
  v.append(el('div','count','기사 '+L.length+'건 (최근 '+(D[tab+'_days']||'-')+'일, 수집 '+(D[tab+'_updated']||'-')+')'));
  const ol=el('ol');
  L.forEach(n=>{const li=el('li');const h=el('div');h.append(link(n.url,n.title));li.append(h,meta(n.source,n.date));ol.append(li)});
  v.append(ol);
}
TABS.forEach(k=>$('#t-'+k).onclick=()=>{tab=k;render()});
function load(){fetch('data.json?t='+Date.now()).then(r=>r.json()).then(d=>{D=d;
  $('#upd').textContent=d.updated?'마지막 업데이트 '+d.updated+' (한국시간)':'';
  $('#sample').hidden=!d.sample;
  const f=$('#foot');f.replaceChildren();(d.notes||[]).forEach(n=>f.append(el('div',null,n)));
  render()}).catch(()=>{$('#view').replaceChildren(el('p','empty','데이터를 불러오지 못했습니다. 새로고침해 주세요.'))})}
load();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script></body></html>
